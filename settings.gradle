pluginManagement {
	repositories {
		gradlePluginPortal()
		mavenCentral()
		exclusiveContent {
			forRepository {
				maven {
					name = 'Fabric'
					url = uri('https://maven.fabricmc.net/')
				}
			}
			filter {
				includeGroupAndSubgroups('net.fabricmc')
			}
		}
	}
}

rootProject.name = 'tiered'
include('common')
include('fabric')
include('neoforge')
